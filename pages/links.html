                    <style>
                        @import url("../colors.css");

                        .content {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                        }

                        /* Conteneur principal des icônes */
                        .icon-grid {
                            display: flex;
                            flex-wrap: wrap;
                            justify-content: center;
                            gap: 30px; /* Espace entre les icônes */
                            max-width: 750px;
                            margin: 30px auto;
                            padding: 30px 20px;
                            background: var(--brbg2); /* #141414 */
                            border: 1px solid var(--border);
                            border-radius: 4px;
                            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5); /* Profondeur */
                        }

                        /* Style de chaque lien */
                        a.icon-item {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            text-decoration: none;
                            transition: transform 0.2s ease-in-out;
                        }

                        /* IMPORTANT : Annule le hover rouge global de ton style.css */
                        a.icon-item:hover {
                            background-color: transparent !important;
                            color: inherit !important;
                            transform: translateY(-5px) scale(1.1); /* Petit saut et zoom */
                        }

                        /* Style de l'icône de base */
                        .icon-item i {
                            font-size: 42px; /* Icônes plus grandes */
                            color: #a0a0a0; /* Gris clair par défaut pour le contraste */
                            margin-bottom: 10px;
                            transition: all 0.3s ease;
                        }

                        /* Style du texte sous l'icône */
                        .icon-item span {
                            font-size: 11px;
                            text-transform: uppercase;
                            font-weight: 900;
                            letter-spacing: 1px;
                            color: var(--cyber-yellow); /* Jaune néon */
                            transition: all 0.3s ease;
                        }

                        /* --- EFFETS HOVER ET COULEURS DE MARQUES (Contraste optimisé) --- */

                        /* Lueur générale au survol */
                        a.icon-item:hover i {
                            filter: drop-shadow(0 0 12px currentColor);
                        }

                        /* Texte en blanc lumineux au survol */
                        a.icon-item:hover span {
                            color: #ffffff;
                            text-shadow: 0 0 8px #ffffff;
                        }

                        /* Couleurs spécifiques (éclaircies pour le fond sombre) */
                        .icon-github:hover i {
                            color: #ffffff;
                        }
                        .icon-soundcloud:hover i {
                            color: #ff5500;
                        }
                        .icon-roblox:hover i {
                            color: #ff3b30;
                        } /* Rouge plus vif */
                        .icon-spotify:hover i {
                            color: #1db954;
                        }
                        .icon-mal:hover i {
                            color: #4a7cd6;
                        } /* Bleu clair pour contraster */
                        .icon-apple:hover i {
                            color: #fa57c1;
                        }
                        .icon-discord:hover i {
                            color: #5865f2;
                        }
                        .icon-namemc:hover i {
                            color: #00aaff;
                        }
                        .icon-paypal:hover i {
                            color: #009cde;
                        } /* Bleu lumineux PayPal */
                        .icon-x:hover i {
                            color: #ffffff;
                        }
                        .icon-letterboxd:hover i {
                            color: #00e054;
                        }
                        .icon-vndb:hover i {
                            color: #ff3344;
                        } /* Rouge plus lumineux */
                    </style>
